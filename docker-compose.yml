version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      POSTGRES_URL: ${POSTGRES_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/postgres}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/postgres}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_FALLBACK_MODELS: ${EMBEDDING_FALLBACK_MODELS:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-mistral}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-15.0}
      CHAT_API_KEY: ${CHAT_API_KEY:-changeme-chat}
      CHAT_TIMEOUT_SECONDS: ${CHAT_TIMEOUT_SECONDS:-20.0}
      CHAT_MAX_TOKENS: ${CHAT_MAX_TOKENS:-600}
      STRUCTURED_MAX_ROWS: ${STRUCTURED_MAX_ROWS:-50000}
      STRUCTURED_SAMPLE_SIZE: ${STRUCTURED_SAMPLE_SIZE:-5}
      SQL_QUERY_TIMEOUT: ${SQL_QUERY_TIMEOUT:-5.0}
      SQL_ALLOWED_FUNCTIONS: ${SQL_ALLOWED_FUNCTIONS:-count,sum,avg,min,max}
      VECTOR_DIM: ${VECTOR_DIM:-1536}
      VECTOR_TIMEOUT_SECONDS: ${VECTOR_TIMEOUT_SECONDS:-10.0}
      LOCAL_INGEST_ROOT: ${LOCAL_INGEST_ROOT:-/app/data}
      CHUNK_SIZE: ${CHUNK_SIZE:-400}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-40}
      INGEST_DEFAULT_TENANT: ${INGEST_DEFAULT_TENANT:-default}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-changeme}
      RETRIEVAL_TOP_K_DEFAULT: ${RETRIEVAL_TOP_K_DEFAULT:-8}
      RETRIEVAL_SCORE_FLOOR: ${RETRIEVAL_SCORE_FLOOR:-0.35}
      RETRIEVAL_SCORE_CEILING: ${RETRIEVAL_SCORE_CEILING:-0.95}
      RETRIEVAL_DIAGNOSTICS: ${RETRIEVAL_DIAGNOSTICS:-false}
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-true}
      PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-true}
      PROMETHEUS_PORT: ${PROMETHEUS_PORT:-8000}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      TRACE_SAMPLE_RATE: ${TRACE_SAMPLE_RATE:-0.1}
      EVAL_TOP_K: ${EVAL_TOP_K:-5}
      EVAL_OUTPUT_DIR: ${EVAL_OUTPUT_DIR:-/app/reports}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      VOICE_STT_API_KEY: ${VOICE_STT_API_KEY:-}
      VOICE_TTS_API_KEY: ${VOICE_TTS_API_KEY:-}
      VOICE_CONFIDENCE_THRESHOLD: ${VOICE_CONFIDENCE_THRESHOLD:-0.6}
      VOICE_RECORDINGS_PATH: ${VOICE_RECORDINGS_PATH:-/app/data/recordings}
      VOICE_STREAM_TIMEOUT_SECONDS: ${VOICE_STREAM_TIMEOUT_SECONDS:-25.0}
    volumes:
      - ./backend:/app/backend
      - ./data/recordings:${VOICE_RECORDINGS_PATH:-/app/data/recordings}
    ports:
      - "8000:8000"
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - postgres
      - qdrant

  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.7.3
    ports:
      - "6333:6333"

  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  loki:
    image: grafana/loki:2.9.0
    profiles: ["observability"]
    command:
      - -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./ops/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  postgres_data:
